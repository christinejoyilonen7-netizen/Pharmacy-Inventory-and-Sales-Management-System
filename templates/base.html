<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PharmaTrack</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
{% if session.user_id %}<nav><div class="brand">💊 PharmaTrack</div><a href="/">Dashboard</a><a href="/medicines">Medicines</a><a href="/suppliers">Suppliers</a><a href="/customers">Customers</a><a href="/sales">Sales</a><span class="spacer"></span><span>{{ session.username }}</span><a href="/logout">Logout</a></nav>{% endif %}
<main>{% with m=get_flashed_messages(with_categories=true) %}{% for cat,msg in m %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
