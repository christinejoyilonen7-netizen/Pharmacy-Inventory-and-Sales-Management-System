{% extends "base.html" %}{% block content %}<h1>{{"Edit" if row else "Add"}} Medicine</h1><form class="form" method="post"><input name="name" placeholder="Medicine Name" required value="{{row.name if row else ''}}"><input name="category" placeholder="Category" required value="{{row.category if row else ''}}"><input name="brand" placeholder="Brand" required value="{{row.brand if row else ''}}"><select name="supplier_id" required><option value="">Select Supplier</option>{% for s in suppliers %}<option value="{{s.id}}" {% if row and row.supplier_id==s.id %}selected{% endif %}>{{s.company_name}}</option>{% endfor %}</select><input type="number" step="0.01" name="unit_price" placeholder="Unit Price" required value="{{row.unit_price if row else ''}}"><input type="number" name="stock_quantity" placeholder="Stock Quantity" required value="{{row.stock_quantity if row else ''}}"><input type="date" name="expiration_date" required value="{{row.expiration_date if row else ''}}"><button>Save Medicine</button><a href="/medicines">Cancel</a></form>{% endblock %}
