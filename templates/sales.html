{% extends "base.html" %}{% block content %}<h1>Sales</h1><div class="grid"><section><h2>Record Sale</h2><form class="form" method="post"><select name="customer_id" required><option value="">Select Customer</option>{% for x in customers %}<option value="{{x.id}}">{{x.name}}</option>{% endfor %}</select><select name="medicine_id" required><option value="">Select Medicine</option>{% for x in meds %}<option value="{{x.id}}">{{x.name}} ({{x.stock_quantity}} available)</option>{% endfor %}</select><input type="number" name="quantity" min="1" placeholder="Quantity" required><select name="payment_method"><option>Cash</option><option>Card</option><option>GCash</option></select><button>Complete Sale</button></form></section><section><h2>Sales History</h2><table><tr><th>ID</th><th>Date</th><th>Customer</th><th>Medicine</th><th>Qty</th><th>Total</th><th>Action</th></tr>{% for x in rows %}<tr><td>#{{x.id}}</td><td>{{x.sale_date}}</td><td>{{x.customer_name}}</td><td>{{x.medicine_name}}</td><td>{{x.quantity}}</td><td>₱{{"%.2f"|format(x.total_amount)}}</td><td><form class="inline" method="post" action="/sales/{{x.id}}/delete" onsubmit="return confirm('Delete sale and restore stock?')"><button class="danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="7">No sales yet.</td></tr>{% endfor %}</table></section></div>{% endblock %}
