{% extends "base.html" %}{% block content %}<div class="title"><h1>{{ title }}</h1></div><div class="grid"><section><h2>Add {{ singular }}</h2><form class="form" method="post">{% for f in fields %}<input name="{{f[0]}}" placeholder="{{f[1]}}" {% if f[2] %}required{% endif %}>{% endfor %}<button>Save</button></form></section><section><form class="search"><input name="q" value="{{q}}" placeholder="Search"><button>Search</button></form><table><tr>{% for h in headers %}<th>{{h}}</th>{% endfor %}<th>Action</th></tr>{% for x in rows %}<tr>{% for k in keys %}<td>{{x[k]}}</td>{% endfor %}<td><form class="inline" method="post" action="{{delete_base}}/{{x.id}}/delete" onsubmit="return confirm('Delete this record?')"><button class="danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="10">No records found.</td></tr>{% endfor %}</table></section></div>{% endblock %}
